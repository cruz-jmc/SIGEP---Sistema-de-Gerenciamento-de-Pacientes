services:
  backend:
    build:
      context: ./sigep-backend
      dockerfile: Dockerfile

    image: sigep-backend:dev

    container_name: sigep-backend

    ports:
      - "127.0.0.1:8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_FLYWAY_ENABLED: ${SPRING_FLYWAY_ENABLED:-true}
      DB_URL: ${DB_URL:?DB_URL nao definida}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME nao definido}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD nao definida}