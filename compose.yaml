services:
  backend:
    build:
      context: ./sigep-backend
      dockerfile: Dockerfile
    image: sigep-backend:dev
    container_name: sigep-backend
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_FLYWAY_ENABLED: ${SPRING_FLYWAY_ENABLED:-true}
      DB_URL: ${DB_URL:?DB_URL nao definida}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME nao definido}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD nao definida}
      SIGEP_ADMIN_NOME: ${SIGEP_ADMIN_NOME}
      SIGEP_ADMIN_EMAIL: ${SIGEP_ADMIN_EMAIL}
      SIGEP_ADMIN_SENHA: ${SIGEP_ADMIN_SENHA}
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      SIGEP_MAIL_FROM: "convites@sigep.example"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: sigep
      POSTGRES_USER: sigep
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?LOCAL_DB_PASSWORD nao definida}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigep -d sigep"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.33.1
    container_name: sigep-mailpit
    ports:
      - "127.0.0.1:8025:8025"
    expose:
      - "1025"
    environment:
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      SPRING_MAIL_USERNAME: ""
      SPRING_MAIL_PASSWORD: ""
      SIGEP_MAIL_FROM: "convites@sigep.example"

volumes:
  postgres_data: