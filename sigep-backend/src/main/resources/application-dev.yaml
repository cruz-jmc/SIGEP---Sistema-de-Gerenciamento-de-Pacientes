spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sigep}
    username: ${DB_USERNAME:sigep}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

sigep:
  mail:
    from: ${SIGEP_MAIL_FROM:convites@sigep.example}