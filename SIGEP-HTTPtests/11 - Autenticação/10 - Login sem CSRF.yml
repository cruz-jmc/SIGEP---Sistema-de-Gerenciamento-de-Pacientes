info:
  name: 10 - Login sem CSRF
  type: http
  seq: 10

http:
  method: POST
  url: "{{baseUrl}}/api/auth/login"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/x-www-form-urlencoded
  body:
    type: form-urlencoded
    data:
      - name: email
        value: "{{coordenadorEmail}}"
      - name: password
        value: "{{coordenadorSenha}}"
  auth: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("HTTP 403", function () {
          expect(res.getStatus()).to.equal(403);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false
