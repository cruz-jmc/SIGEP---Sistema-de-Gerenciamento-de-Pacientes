info:
  name: 06 - Confirmar sessão do funcionário
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/api/auth/me"
  headers:
    - name: Accept
      value: application/json
  auth: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("HTTP 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Sessão autenticada como FUNCIONARIO", function () {
          const dados = res.getBody();
          expect(dados.autenticado).to.be.true;
          expect(dados.email === bru.getEnvVar("funcionarioEmail")).to.be.true;
          expect(dados.permissoes).to.include("ROLE_FUNCIONARIO");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false
