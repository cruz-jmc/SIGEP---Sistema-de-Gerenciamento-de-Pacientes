info:
  name: Cadastrar profissional
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/profissionais"
  body:
    type: json
    data: |-
      {
        "nome": "cruz",
        "conselho": "CONSELHO-fulano",
        "registroConselho": "CP3-FICTICIO-003"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const profissional = res.getBody();

        if (res.getStatus() === 201 && profissional?.id != null) {
          bru.setEnvVar("profissionalId", profissional.id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
