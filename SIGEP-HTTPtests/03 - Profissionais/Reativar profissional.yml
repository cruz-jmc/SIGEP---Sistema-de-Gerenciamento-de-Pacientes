info:
  name: Reativar profissional
  type: http

http:
  method: PATCH
  url: "{{baseUrl}}/api/profissionais/{{profissionalId}}/ativo?ativo=true"
  params:
    - name: ativo
      value: "true"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
