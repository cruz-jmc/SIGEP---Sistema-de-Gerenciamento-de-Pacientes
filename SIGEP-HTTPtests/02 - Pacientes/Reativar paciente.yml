info:
  name: Reativar paciente
  type: http
  seq: 1

http:
  method: PATCH
  url: "{{baseUrl}}/api/pacientes/{{pacienteId}}/ativo?ativo=true"
  params:
    - name: ativo
      value: "true"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
