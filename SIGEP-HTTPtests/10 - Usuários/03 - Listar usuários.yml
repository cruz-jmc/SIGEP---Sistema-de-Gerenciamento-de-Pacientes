info:
  name: 03 - Listar usuários
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/usuarios"
  headers:
    - name: Accept
      value: application/json
  auth: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("HTTP 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("A lista inclui o funcionário cadastrado", function () {
          const dados = res.getBody();
          const id = Number(bru.getVar("funcionarioId"));
          const email = bru.getVar("funcionarioEmailAtual") || bru.getEnvVar("funcionarioEmail");
          expect(Array.isArray(dados)).to.be.true;
          expect(dados.some((usuario) => usuario.id === id && usuario.email === email
            && usuario.perfil === "FUNCIONARIO")).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false
