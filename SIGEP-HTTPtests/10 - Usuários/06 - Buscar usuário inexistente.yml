info:
  name: 06 - Buscar usuário inexistente
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/api/usuarios/99999"
  headers:
    - name: Accept
      value: application/json
  auth: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("HTTP 400", function () {
          expect(res.getStatus()).to.equal(400);
        });

        test("Retorna o erro esperado", function () {
          expect(res.getBody().erro === "Usuário não encontrado: 99999").to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false
