http:
  method: DELETE
  url: "{{baseUrl}}/api/usuarios/{{funcionarioId}}"
  headers:
    - name: Accept
      value: application/json
    - name: X-XSRF-TOKEN
      value: "{{csrfToken}}"
  auth: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("HTTP 204", function () {
          expect(res.getStatus()).to.equal(204);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false
