info:
  name: 01 - Cadastrar funcionário
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/usuarios"
  headers:
    - name: Accept
      value: application/json
    - name: X-XSRF-TOKEN
      value: "{{csrfToken}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "nome": "Funcionário Demonstração",
        "email": "{{funcionarioEmail}}"
      }
  auth: none

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.deleteVar("funcionarioId");

        const dados = res.getBody();
        if (res.getStatus() === 201 && Number.isSafeInteger(dados?.id) && dados.id > 0) {
          bru.setVar("funcionarioId", String(dados.id));
        }
    - type: tests
      code: |-
        test("HTTP 201", function () {
          expect(res.getStatus()).to.equal(201);
        });

        test("Retorna o funcionário pendente e registra seu ID", function () {
          const dados = res.getBody();
          expect(Number.isSafeInteger(dados.id) && dados.id > 0).to.be.true;
          expect(bru.getVar("funcionarioId")).to.equal(String(dados.id));
          expect(dados.email === bru.getEnvVar("funcionarioEmail")).to.be.true;
          expect(dados.perfil).to.equal("FUNCIONARIO");
          expect(dados.ativo).to.be.false;
          expect(dados.primeiroAcesso).to.be.true;
          expect(Number.isSafeInteger(dados.criadoPorId) && dados.criadoPorId > 0).to.be.true;
          expect(["senha", "senhaHash", "token"].some((campo) => Object.hasOwn(dados, campo))).to.be.false;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false
