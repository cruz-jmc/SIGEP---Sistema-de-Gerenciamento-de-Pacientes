info:
  name: 07 - Ativar com convite válido
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/api/ativacao"
  headers:
    - name: Accept
      value: application/json
    - name: X-XSRF-TOKEN
      value: "{{csrfToken}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: "{}"
  auth: none

runtime:
  scripts:
    - type: before-request
      code: |-
        req.setBody({
          token: bru.getEnvVar("ativacaoToken"),
          senha: bru.getEnvVar("funcionarioSenha")
        });
    - type: tests
      code: |-
        test("HTTP 204", function () {
          expect(res.getStatus()).to.equal(204);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false
